name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".golangci.yml"
      - "**/*.go"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "LICENSE"
      - "Makefile"
      - "schema/**"
      - "testdata/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".golangci.yml"
      - "**/*.go"
      - "examples/**"
      - "go.mod"
      - "go.sum"
      - "LICENSE"
      - "Makefile"
      - "schema/**"
      - "testdata/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "${unformatted}" ]]; then
            echo "${unformatted}"
            echo "::error::run gofmt on the files listed above"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go tool staticcheck ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Vulnerability scan
        run: go tool govulncheck ./...
      - name: Build
        run: go build ./...

  dogfood:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Draincheck
        run: |
          mkdir -p bin
          go build -trimpath -o bin/draincheck ./cmd/draincheck
      - name: Build release-style fixture image
        run: |
          docker build \
            -f testdata/services/good-http/Dockerfile \
            -t "draincheck-good:${{ github.sha }}" \
            testdata/services
      - name: Verify fixture lifecycle with Draincheck
        run: |
          mkdir -p reports/dogfood
          docker --version | tee reports/dogfood/runtime-version.txt
          ./bin/draincheck verify "draincheck-good:${{ github.sha }}" \
            --runtime docker \
            --config testdata/services/good-http/draincheck.yaml \
            --report-json reports/dogfood/draincheck.json \
            --report-junit reports/dogfood/draincheck.xml \
            --debug-bundle reports/dogfood/draincheck-debug.zip \
            --no-color
      - name: Upload dogfood evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: draincheck-dogfood-evidence
          path: reports/dogfood/
          if-no-files-found: warn

  lifecycle:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Podman
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: Record runtime version
        env:
          RUNTIME: ${{ matrix.runtime }}
          REPORT_DIRECTORY: reports/conformance-${{ matrix.runtime }}
        run: |
          mkdir -p "$REPORT_DIRECTORY"
          "$RUNTIME" --version | tee "$REPORT_DIRECTORY/runtime-version.txt"
      - name: Run lifecycle conformance suite
        env:
          DRAINCHECK_E2E_RUNTIME: ${{ matrix.runtime }}
          DRAINCHECK_E2E_REPORT_DIR: reports/conformance-${{ matrix.runtime }}
        run: go test -v -count=1 ./testdata/e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: draincheck-reports-${{ matrix.runtime }}
          path: reports/
