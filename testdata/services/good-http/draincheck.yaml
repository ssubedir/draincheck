# Dogfood configuration for the release-style graceful HTTP fixture image.
# CI overrides target.image with the immutable image tag built for the current commit.
version: 1

target:
  image: draincheck-good:dogfood
  container_port: 8080
  environment:
    DRAINCHECK_FIXTURE_MODE: graceful

readiness:
  path: /ready
  success_status: 200
  startup_timeout: 10s
  interval: 100ms

traffic:
  request:
    method: GET
    path: /work?delay=2s
    headers: {}
  count: 5
  concurrency: 5
  shutdown_after: 250ms
  request_timeout: 5s

shutdown:
  signal: SIGTERM
  deadline: 5s

assertions:
  readiness_withdrawn_within: 1s
  inflight_requests_complete: true
  max_failed_requests: 0
  exit_code: 0
  forbid_force_kill: true
