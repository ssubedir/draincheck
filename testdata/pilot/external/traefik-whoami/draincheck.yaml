# Direct-image pilot for Traefik Whoami v1.12.0.
# Whoami provides a real health route and a deterministic delayed demo request. The upstream image
# is intentionally unmodified so Draincheck records its actual signal and in-flight behavior.
version: 1

target:
  image: docker.io/traefik/whoami@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
  container_port: 80
  environment:
    WHOAMI_NAME: draincheck-pilot

readiness:
  path: /health
  success_status: 200
  startup_timeout: 20s
  interval: 100ms

traffic:
  request:
    method: GET
    path: /?wait=2s
    headers:
      X-Forwarded-Proto: https
      X-Demo-Middleware: draincheck
  count: 5
  concurrency: 5
  shutdown_after: 250ms
  request_timeout: 8s

shutdown:
  signal: SIGTERM
  deadline: 15s

assertions:
  readiness_withdrawn_within: 2s
  inflight_requests_complete: true
  max_failed_requests: 0
  exit_code: 0
  forbid_force_kill: true
