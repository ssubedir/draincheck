# External-image pilot for postmanlabs/httpbin using its documented Docker image.
# The immutable digest identifies the published linux/amd64 image behind `latest`.
# There is no dedicated readiness route; /get is an ordinary application endpoint, and listener
# closure supplies readiness-withdrawal evidence after SIGTERM.
version: 1

target:
  image: docker.io/kennethreitz/httpbin@sha256:599fe5e5073102dbb0ee3dbb65f049dab44fa9fc251f6835c9990f8fb196a72b
  container_port: 80
  environment: {}

readiness:
  path: /get
  success_status: 200
  startup_timeout: 30s
  interval: 200ms

traffic:
  request:
    method: GET
    path: /delay/2
    headers: {}
  count: 5
  concurrency: 5
  shutdown_after: 250ms
  request_timeout: 8s

shutdown:
  signal: SIGTERM
  deadline: 15s

assertions:
  readiness_withdrawn_within: 2s
  inflight_requests_complete: true
  max_failed_requests: 0
  exit_code: 0
  forbid_force_kill: true
