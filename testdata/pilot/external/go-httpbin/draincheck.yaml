# External-image pilot for go-httpbin v2.25.0.
# The digest is the published multi-platform OCI index for the release tag.
# There is no dedicated readiness route; /get is an ordinary application endpoint, and listener
# closure supplies readiness-withdrawal evidence after SIGTERM.
version: 1

target:
  image: ghcr.io/mccutchen/go-httpbin@sha256:20739736d4eb8dc1b998dff701f437b8bd62dcc46492bd0d861e89890ca36500
  container_port: 8080
  environment:
    LOG_LEVEL: INFO

readiness:
  path: /get
  success_status: 200
  startup_timeout: 20s
  interval: 100ms

traffic:
  request:
    method: GET
    path: /delay/2s
    headers: {}
  count: 5
  concurrency: 5
  shutdown_after: 250ms
  request_timeout: 8s

shutdown:
  signal: SIGTERM
  deadline: 15s

assertions:
  readiness_withdrawn_within: 2s
  inflight_requests_complete: true
  max_failed_requests: 0
  exit_code: 0
  forbid_force_kill: true
