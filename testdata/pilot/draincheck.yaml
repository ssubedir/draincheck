# Shared lifecycle contract for the cross-runtime pilot services.
# The harness overrides target.image with the image built for each case.
version: 1

target:
  image: overridden-by-pilot-harness
  container_port: 8080

readiness:
  path: /ready
  success_status: 200
  startup_timeout: 20s
  interval: 100ms

traffic:
  request:
    method: GET
    path: /work?delay_ms=2000
    headers: {}
  count: 5
  concurrency: 5
  shutdown_after: 250ms
  request_timeout: 8s

shutdown:
  signal: SIGTERM
  deadline: 15s

assertions:
  readiness_withdrawn_within: 2s
  inflight_requests_complete: true
  max_failed_requests: 0
  exit_code: 0
  forbid_force_kill: true
